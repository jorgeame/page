<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagen Menu</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow-y: auto; /* Habilitar scroll vertical */
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Alinear la imagen al inicio */
            background-color: #f4f4f9;
            font-family: Arial, sans-serif;
        }
        a {
            width: 100%;
        }
        img {
            width: 100%; /* Ocupa el ancho completo de la pantalla */
            height: auto; /* Ajusta la altura automáticamente */
            display: block;
        }
    </style>
</head>
<body>
    <a href="https://jorgeame.github.io/page/credencial_martha.html" target="_blank">
        <img src="Menu.jpeg" alt="Imagen de menu">
    </a>
</body>
</html>
